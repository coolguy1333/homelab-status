services:
  uptime-monitor:
    build: .
    image: uptime-monitor:latest
    container_name: uptime-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # API token for scripts. Leave empty to auto-generate one (see: docker compose logs uptime-monitor)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SITE_TITLE: ${SITE_TITLE:-Uptime Monitor}
      TZ: ${TZ:-UTC}
      # Sign-in: Cloudflare Access in front of the domain (docs/CLOUDFLARE_ACCESS.md)
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # NOTIFY_WEBHOOK_URL: https://discord.com/api/webhooks/...
      # TRUST_PROXY: "true"   # set when running behind Caddy / nginx / Traefik
      # Multi-server: point at your other Uptime Monitor deployments (not this one)
      # PEERS: https://status-eu.example.com,https://status-us.example.com
      # PEER_TOKEN: some-long-shared-secret   # same value on every server
    volumes:
      - uptime-data:/data

volumes:
  uptime-data:
