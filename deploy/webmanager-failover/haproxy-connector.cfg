# WebManager failover for the Cloudflare tunnel (see wm-ha on CT212/CT213).
# cloudflared -> http://localhost:8081 -> whichever WebManager is the active
# primary (Host wm-ha.internal /active = 200). If neither is active (e.g. the
# primary just died and the replica hasn't auto-promoted yet), fall back to
# any server whose /healthz answers, so static sites keep working.
global
    log /dev/log local0 warning
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option dontlognull
    timeout connect 3s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h
    retries 2
    option redispatch

frontend webmanager
    bind 127.0.0.1:8081
    default_backend webmanager

backend webmanager
    balance first
    server ct212 192.168.10.20:8080 track chk_active/ct212
    server ct213 192.168.10.116:8080 track chk_active/ct213
    server ct212-any 192.168.10.20:8080 backup track chk_health/ct212
    server ct213-any 192.168.10.116:8080 backup track chk_health/ct213

backend chk_active
    option httpchk
    http-check send meth GET uri /active ver HTTP/1.1 hdr Host wm-ha.internal
    http-check expect status 200
    default-server inter 3s fall 2 rise 2
    server ct212 192.168.10.20:8080 check
    server ct213 192.168.10.116:8080 check

backend chk_health
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host 127.0.0.1
    http-check expect status 200
    default-server inter 3s fall 2 rise 3
    server ct212 192.168.10.20:8080 check
    server ct213 192.168.10.116:8080 check

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
