# WebManager failover for the Cloudflare tunnel (see wm-ha on CT212/CT213).
# cloudflared -> http://localhost:8081 -> whichever WebManager is the active
# primary (Host wm-ha.internal /active = 200). If neither is active (e.g. the
# primary just died and the replica hasn't auto-promoted yet), fall back to
# any server whose /healthz answers, so static sites keep working.
global
    log /dev/log local0 warning
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option dontlognull
    timeout connect 3s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h
    retries 2
    option redispatch

frontend webmanager
    bind 127.0.0.1:8081
    # The status site moved off WebManager to its own pair of containers (deploy/uptime-ha).
    # Until the tunnel has its own upt.webmgr.dev -> http://localhost:8082 route, the
    # *.webmgr.dev wildcard brings it here, so send it on.
    acl host_upt hdr(host),field(1,:) -i upt.webmgr.dev
    use_backend uptime if host_upt
    default_backend webmanager

backend webmanager
    balance first
    server ct212 192.168.10.20:8080 track chk_active/ct212
    server ct213 192.168.10.116:8080 track chk_active/ct213
    server ct212-any 192.168.10.20:8080 backup track chk_health/ct212
    server ct213-any 192.168.10.116:8080 backup track chk_health/ct213

backend chk_active
    option httpchk
    http-check send meth GET uri /active ver HTTP/1.1 hdr Host wm-ha.internal
    http-check expect status 200
    default-server inter 3s fall 2 rise 2
    server ct212 192.168.10.20:8080 check
    server ct213 192.168.10.116:8080 check

backend chk_health
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host 127.0.0.1
    http-check expect status 200
    default-server inter 3s fall 2 rise 3
    server ct212 192.168.10.20:8080 check
    server ct213 192.168.10.116:8080 check

# Homelab Status (upt.webmgr.dev): CT 214 UptimeMonitor on GOD (preferred) and CT 215
# UptimeMonitor2 on HELP, kept in sync by um-ha. Traffic goes to whichever has
# :8099/active = 200 (the primary with a healthy app). If neither does (um-ha
# itself down), fall back to any app that answers /api/health. Tunnel service:
# http://localhost:8082.
frontend uptime
    bind 127.0.0.1:8082
    default_backend uptime

backend uptime
    balance first
    server um1 192.168.10.213:3000 track chk_um_active/um1
    server um2 192.168.10.110:3000 track chk_um_active/um2
    server um1-any 192.168.10.213:3000 backup track chk_um_health/um1
    server um2-any 192.168.10.110:3000 backup track chk_um_health/um2

backend chk_um_active
    option httpchk
    http-check send meth GET uri /active ver HTTP/1.1 hdr Host um-ha
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server um1 192.168.10.213:8099 check
    server um2 192.168.10.110:8099 check

backend chk_um_health
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host 127.0.0.1
    http-check expect status 200
    default-server inter 3s fall 2 rise 2
    server um1 192.168.10.213:3000 check
    server um2 192.168.10.110:3000 check

# Proxmox web UI (pm/pve/proxmox.mhsit.club) for cluster HELLLLP: HELP first,
# GOD if HELP's :8006 stops answering. TCP passthrough keeps Proxmox's own TLS,
# noVNC/xterm.js websockets and API untouched; the tunnel service is
# https://localhost:8006 with "No TLS Verify" on (as it already was).
frontend proxmox
    mode tcp
    bind 127.0.0.1:8006
    default_backend proxmox

backend proxmox
    mode tcp
    balance first
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 check-ssl verify none
    server help 192.168.10.81:8006 check
    server god 192.168.10.23:8006 check backup

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
